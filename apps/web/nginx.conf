# Reverse proxy for a single-tenant deployment (ADR-0002).
#
# TLS terminates here, not in the app: the app does not own certificates, and a
# hospital's operations team expects to manage them. Everything upstream is plain HTTP
# on a private network.
#
# Deliberately absent: any `add_header` for Content-Security-Policy. The policy is
# per-response and carries a nonce (src/middleware.ts); duplicating it here would emit
# two headers and the browser would intersect them, which silently breaks hydration.

upstream reporting_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Redirect rather than serve: a clinical tool on plain HTTP is a mistake worth
    # making loud.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A report body plus its template can be large; the default 1m truncates.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Build-hashed: safe to cache for a year.
    location /_next/static/ {
        proxy_pass http://reporting_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The worker must never be served from a cache, or a device keeps an old allowlist.
    location = /sw.js {
        proxy_pass http://reporting_web;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://reporting_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;

        # No access log by default: the request URI of a report route carries a report
        # id, and a log file is a copy of it that nobody classified.
        access_log off;
    }
}
