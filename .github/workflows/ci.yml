name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A CI that queues behind superseded commits teaches people to
# ignore it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  verify:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real PostgreSQL 16, not a mock. The isolation test asserts that no row
    # crosses between two tenants, and that assertion is only worth anything
    # against the database that will serve patients.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for a container that dies with the job.
      TEST_DATABASE_URL: postgres://reporting_owner:ci_owner@127.0.0.1:5432/reporting_test
      TEST_APP_DATABASE_URL: postgres://reporting_app:ci_app@127.0.0.1:5432/reporting_test

    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field, so CI
      # and a developer machine cannot disagree about the package manager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: a lockfile that differs from package.json fails here,
      # not in a customer environment.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Two roles, not one: the application role owns nothing and cannot bypass
      # RLS, which is the property the isolation test exercises.
      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres \
            -v owner_password=ci_owner \
            -v app_password=ci_app \
            -f db/setup/bootstrap.sql

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The lockfile is an input to the build, so it must not be rewritten by it.
      # Caught here rather than in a review comment.
      - name: Lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      # ADR-0006: generated output is not source. If a build writes into a
      # tracked path, this fails before someone commits a stale artefact.
      - name: No tracked build output
        run: |
          if git status --porcelain -- ':!pnpm-lock.yaml' | grep -q .; then
            echo "::error::The build modified tracked files. Commit the output or stop tracking it."
            git status --porcelain
            exit 1
          fi

      # The fidelity gate (plan §17, P1 exit): 427 files in, 427 out, byte for
      # byte, zero quarantined. Exit code 2 from the CLI means a file failed, and
      # a failed import never looks like a successful one.
      - name: Corpus round-trip
        run: pnpm corpus

      # Determinism: regenerating the artefacts must produce exactly what is
      # committed. If this fails, either the importer changed behaviour or the
      # committed output was edited by hand.
      - name: Artefacts reproducible
        run: git diff --exit-code -- corpus

  commitlint:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range has to exist locally to be linted.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint commits on this branch
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"
