<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlemHealth Reporting</title>
<meta name="description" content="Offline-first radiology report editor built on the AlemHealth template library.">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e1116'/%3E%3Cpath d='M18 44V20h6l8 13 8-13h6v24h-6V31l-8 12-8-12v13z' fill='%235bd6a4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span class="brand-text">AlemHealth Reporting</span>
    </div>

    <div class="topbar-actions">
      <button id="btn-rail" class="btn btn-ghost nav-toggle" type="button"
              aria-expanded="false" aria-controls="rail">Sections</button>
      <button id="btn-context" class="btn btn-ghost nav-toggle" type="button"
              aria-expanded="false" aria-controls="context">Review
        <span id="ctx-badge" class="badge badge-warn" hidden>0</span>
      </button>

      <div id="nav-links" class="nav-links">
        <button id="btn-library" class="btn btn-ghost" type="button">Templates</button>
        <button id="btn-drafts" class="btn btn-ghost" type="button">Drafts <span id="draft-count" class="badge" hidden>0</span></button>
        <button id="btn-audit" class="btn btn-ghost" type="button">Activity</button>
      </div>

      <button id="btn-theme" class="btn btn-icon" type="button" title="Toggle theme" aria-label="Toggle light or dark theme">◐</button>
      <button id="btn-settings" class="btn btn-icon" type="button" title="Settings and security" aria-label="Settings and security">⚙</button>
      <button id="btn-menu" class="btn btn-icon nav-toggle" type="button"
              aria-expanded="false" aria-controls="nav-links" aria-label="More navigation">☰</button>
    </div>
  </header>

  <div id="scrim" class="scrim" hidden></div>

  <div id="net-banner" class="net-banner" hidden role="status" aria-live="polite"></div>

  <main id="main" tabindex="-1"></main>

</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
